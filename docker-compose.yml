# The whole system in one command: docker compose up --build
# Compose reads the ${...} values from a .env file next to this file (copy .env.example to .env and fill it in; .env is ignored by git)
# and passes them to the containers as environment variables, which is where secrets live in Docker.
# Containers reach each other by service name on the network Compose creates: the APIs use "db" and "rabbitmq",
# the gateway uses "pos-api" and "notification-api" (ocelot.Docker.json), and the web app uses "gateway".
# The .NET images listen on 8080 inside the network; the ports below are what the host machine sees.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pos-api:
    build:
      context: .
      dockerfile: src/Pos.Api/Dockerfile
    environment:
      ConnectionStrings__PosDatabase: "Server=db;Database=PosDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__CashierPassword: ${SEED_CASHIER_PASSWORD}
      RabbitMq__Host: rabbitmq
    ports:
      - "5024:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-api:
    build:
      context: .
      dockerfile: src/Notification.Api/Dockerfile
    environment:
      ConnectionStrings__NotificationDatabase: "Server=db;Database=NotificationDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET}
      RabbitMq__Host: rabbitmq
    ports:
      - "5026:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/Pos.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5000:8080"
    depends_on:
      - pos-api
      - notification-api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  db-data:
